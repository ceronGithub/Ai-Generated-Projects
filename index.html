<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrpd — AI Web Scraper</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1f1f2e;
      --accent: #00ff88;
      --accent2: #7c3aed;
      --text: #e8e8f0;
      --muted: #555566;
      --error: #ff4466;
      --mono: 'Space Mono', monospace;
      --display: 'Syne', sans-serif;
    }

    ::selection { background: var(--accent); color: #000; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 60px 24px 100px;
    }

    /* HEADER */
    header {
      margin-bottom: 56px;
      animation: slideDown 0.7s cubic-bezier(.16,1,.3,1) both;
    }

    .logo {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(2.8rem, 8vw, 4.5rem);
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--text);
    }

    .logo span {
      color: var(--accent);
      position: relative;
    }

    .logo span::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 0; right: 0;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
    }

    .tagline {
      margin-top: 12px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--muted);
    }

    .tagline em {
      color: var(--accent);
      font-style: normal;
    }

    /* MAIN CARD */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 36px;
      animation: slideUp 0.7s cubic-bezier(.16,1,.3,1) 0.1s both;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .field-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }

    input[type="url"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 14px 16px;
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="url"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,255,136,0.08);
    }

    input[type="url"]::placeholder { color: var(--muted); }

    .btn-primary {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 2px;
      padding: 14px 24px;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-primary:hover { background: #00e87a; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled {
      background: var(--muted);
      color: var(--bg);
      cursor: not-allowed;
      transform: none;
    }

    /* STATUS BAR */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 2px;
      margin-bottom: 24px;
      min-height: 46px;
    }

    .status-indicator {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status-indicator.active {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: blink 1s infinite;
    }

    .status-indicator.error { background: var(--error); box-shadow: 0 0 8px var(--error); }
    .status-indicator.done { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: none; }

    .status-text {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .step-counter {
      margin-left: auto;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    /* RESULT */
    #result {
      display: none;
      animation: slideUp 0.5s cubic-bezier(.16,1,.3,1) both;
    }

    #result.visible { display: block; }

    .result-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .chip {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 1px;
      color: var(--muted);
    }

    .chip strong { color: var(--accent); font-weight: 400; }

    .result-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    #summaryText {
      font-family: var(--mono);
      font-size: 0.88rem;
      line-height: 1.85;
      color: var(--text);
      white-space: pre-wrap;
    }

    /* ERROR */
    #errorBox {
      display: none;
      padding: 14px 16px;
      border: 1px solid rgba(255,68,102,0.3);
      background: rgba(255,68,102,0.05);
      border-radius: 2px;
      font-size: 0.78rem;
      color: var(--error);
      line-height: 1.6;
      margin-top: 16px;
    }

    #errorBox.visible { display: block; }

    /* CONFIG NOTICE */
    .config-notice {
      margin-top: 28px;
      padding: 16px;
      border: 1px dashed var(--border);
      border-radius: 2px;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.7;
    }

    .config-notice code {
      color: var(--accent);
      background: rgba(0,255,136,0.06);
      padding: 1px 5px;
      border-radius: 2px;
      font-family: var(--mono);
    }

    /* FOOTER */
    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
      animation: slideUp 0.7s cubic-bezier(.16,1,.3,1) 0.3s both;
    }

    footer span { color: var(--accent); }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* N8N WEBHOOK PLACEHOLDER visible hint */
    #webhookHint {
      font-size: 0.65rem;
      color: rgba(255,68,102,0.8);
      margin-top: 6px;
      display: none;
    }
    #webhookHint.visible { display: block; }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">Scrp<span>d</span></div>
    <div class="tagline">AI web scraper · powered by <em>n8n</em> + <em>netlify</em></div>
  </header>

  <div class="card">
    <div class="field-label">Target URL</div>
    <div class="input-group">
      <input type="url" id="urlInput" placeholder="https://example.com/article" autocomplete="off" />
      <button class="btn-primary" id="scrapeBtn" onclick="runScrape()">Scrape</button>
    </div>

    <div class="status-bar">
      <div class="status-indicator" id="indicator"></div>
      <div class="status-text" id="statusText">Ready</div>
      <div class="step-counter" id="stepCounter"></div>
    </div>

    <div id="result">
      <div class="result-meta">
        <div class="chip">Domain: <strong id="domainChip">—</strong></div>
        <div class="chip">Words: <strong id="wordsChip">—</strong></div>
        <div class="chip">Status: <strong id="statusChip">—</strong></div>
      </div>
      <div class="result-label">AI Summary</div>
      <div id="summaryText"></div>
    </div>

    <div id="errorBox"></div>

    <div class="config-notice" id="configNotice">
      ⚙ Replace <code>YOUR_N8N_WEBHOOK_URL</code> in <code>app.js</code> with your actual n8n webhook URL to activate scraping.
      See <code>SETUP.md</code> for full instructions.
    </div>
  </div>

  <footer>Built with <span>n8n</span> · Deployed on <span>Netlify</span></footer>

</div>
<script src="app.js"></script>
</body>
</html>
