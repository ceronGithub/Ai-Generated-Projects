<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2026 — Full Year Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/booking.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Animated canvas background -->
  <canvas id="bgCanvas"></canvas>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <h1 class="header-year">2026</h1>
        <span class="header-label">Full Year Calendar</span>
      </div>
      <div class="header-today-badge" id="todayBadge"></div>
      <div class="db-status is-connecting" id="dbStatus"><span class="db-dot connecting" id="dbStatusDot"></span><span class="db-status-label" id="dbStatusLabel">Connecting…</span><button onclick="openDbConfigModal()" title="Firebase Settings" style="width:22px;height:22px;border-radius:50%;background:#f0eeff;border:none;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;justify-content:center;margin-left:4px;flex-shrink:0;transition:background 0.15s;" onmouseover="this.style.background='#d0caff'" onmouseout="this.style.background='#f0eeff'">⚙️</button></div>
    </div>
  </header>

  <main class="year-grid" id="yearGrid"></main>

  <!-- ══════════════════════════════
       BOOKING FORM MODAL
  ══════════════════════════════ -->
  <div class="bk-overlay" id="bookingOverlay">
    <div class="bk-modal" id="bookingModal">

      <div class="bk-modal-header">
        <div class="bk-header-left">
          <div class="bk-color-pill" id="bkColorPill"></div>
          <div>
            <span class="bk-header-label">New Booking</span>
            <h2 class="bk-header-date" id="bkHeaderDate"></h2>
          </div>
        </div>
        <div class="bk-header-right">
          <div class="bk-event-badge" id="bkEventBadge">
            <span class="bk-event-icon" id="bkEventIcon"></span>
            <span class="bk-event-label" id="bkEventLabel"></span>
          </div>
          <button class="bk-close" id="bookingClose">&times;</button>
        </div>
      </div>

      <div class="bk-body">

        <!-- Guest Section -->
        <div class="bk-section">
          <div class="bk-section-title">
            <span class="bk-section-icon">👤</span> Guest Information
          </div>
          <div class="bk-grid-2">
            <!-- Row 1: Name | Email -->
            <div class="bk-field">
              <label class="bk-label">Guest Name <span class="bk-req">*</span></label>
              <input class="bk-input" id="bkGuestName" type="text" placeholder="Full name"/>
              <span class="bk-err" id="errGuestName"></span>
            </div>
            <div class="bk-field">
              <label class="bk-label">Guest Email <span class="bk-req">*</span></label>
              <input class="bk-input" id="bkGuestEmail" type="email" placeholder="email@example.com"/>
              <span class="bk-err" id="errGuestEmail"></span>
            </div>
            <!-- Row 2: Phone | Pax -->
            <div class="bk-field">
              <label class="bk-label">Phone Number <span class="bk-req">*</span></label>
              <input class="bk-input" id="bkGuestPhone" type="tel" placeholder="+63 XXX XXX XXXX"/>
              <span class="bk-err" id="errGuestPhone"></span>
            </div>
            <div class="bk-field">
              <label class="bk-label">Pax <span class="bk-req">*</span></label>
              <input class="bk-input bk-num" id="bkPax" type="number" min="1" placeholder="0"/>
              <span class="bk-err" id="errPax"></span>
            </div>
            <!-- Row 3: Total Pax (auto) | Extra Pax -->
            <div class="bk-field">
              <label class="bk-label">Total Pax <span class="bk-opt">(auto)</span></label>
              <div class="bk-auto" id="bkTotalPax">—</div>
            </div>
            <div class="bk-field">
              <label class="bk-label">Extra Pax <span class="bk-opt">(optional)</span></label>
              <input class="bk-input bk-num" id="bkExtraPax" type="number" min="0" placeholder="0"/>
            </div>
            <!-- Row 4: How much per head (full width) -->
            <div class="bk-field bk-field-full">
              <label class="bk-label">How much per head <span class="bk-opt">(optional)</span></label>
              <div class="bk-peso-wrap">
                <span class="bk-peso-sign">₱</span>
                <input class="bk-input bk-peso-input bk-num" id="bkRatePerHead" type="number" min="0" placeholder="0.00"/>
              </div>
            </div>
            <!-- Row 5: Total Pets | How much per pet -->
            <div class="bk-field">
              <label class="bk-label">Total Pets <span class="bk-opt">(optional)</span></label>
              <input class="bk-input bk-num" id="bkPets" type="number" min="0" placeholder="0"/>
            </div>
            <div class="bk-field">
              <label class="bk-label">How much per pet <span class="bk-opt">(optional)</span></label>
              <div class="bk-peso-wrap">
                <span class="bk-peso-sign">₱</span>
                <input class="bk-input bk-peso-input bk-num" id="bkRatePerPet" type="number" min="0" placeholder="0.00"/>
              </div>
            </div>
          </div>
        </div>

        <!-- Payment Section -->
        <div class="bk-section">
          <div class="bk-section-title">
            <span class="bk-section-icon">💳</span> Payment
          </div>
          <div class="bk-grid-2">
            <div class="bk-field">
              <label class="bk-label">Date of Payment <span class="bk-req">*</span></label>
              <input class="bk-input" id="bkPaymentDate" type="date"/>
              <span class="bk-err" id="errPaymentDate"></span>
            </div>
            <div class="bk-field">
              <label class="bk-label">Payment Mode</label>
              <div class="bk-auto bk-mode">🏦 BDO Bank Transfer</div>
            </div>
            <div class="bk-field">
              <label class="bk-label">Total <span class="bk-req">*</span></label>
              <div class="bk-peso-wrap">
                <span class="bk-peso-sign">₱</span>
                <input class="bk-input bk-peso-input bk-num" id="bkTotal" type="number" min="0" placeholder="0.00"/>
              </div>
              <span class="bk-err" id="errTotal"></span>
            </div>
            <div class="bk-field" id="bkAdditionalWrap" style="display:none;">
              <label class="bk-label">Additional Charges <span class="bk-opt">(auto)</span></label>
              <div class="bk-auto bk-additional" id="bkAdditional">—</div>
            </div>
            <div class="bk-field bk-field-full" id="bkFinalTotalWrap" style="display:none;">
              <label class="bk-label">Final Total <span class="bk-opt">(auto-calculated)</span></label>
              <div class="bk-auto bk-final-total" id="bkFinalTotal">—</div>
            </div>
            <div class="bk-field">
              <label class="bk-label">Downpayment <span class="bk-req">*</span></label>
              <div class="bk-peso-wrap">
                <span class="bk-peso-sign">₱</span>
                <input class="bk-input bk-peso-input bk-num" id="bkDownpayment" type="number" min="0" placeholder="0.00"/>
              </div>
              <span class="bk-err" id="errDownpayment"></span>
            </div>
            <div class="bk-field bk-field-full">
              <label class="bk-label">Balance <span class="bk-opt">(auto-generated)</span></label>
              <div class="bk-auto bk-balance" id="bkBalance">—</div>
            </div>
          </div>
        </div>

        <!-- Booking Section -->
        <div class="bk-section">
          <div class="bk-section-title">
            <span class="bk-section-icon">🏡</span> Booking
          </div>
          <div class="bk-grid-2">
            <div class="bk-field bk-field-full">
              <label class="bk-label">Check-in Date</label>
              <div class="bk-auto bk-date-display" id="bkCheckinDisplay">—</div>
            </div>
            <div class="bk-field bk-field-full">
              <label class="bk-label">Tour Type <span class="bk-req">*</span></label>
              <div class="bk-tour-options">
                <button class="bk-tour-btn" data-type="Day Tour">🌤 Day Tour</button>
                <button class="bk-tour-btn" data-type="Night Tour">🌙 Night Tour</button>
                <button class="bk-tour-btn" data-type="Over-Night">🌕 Over-Night</button>
              </div>
              <span class="bk-err" id="errTourType"></span>
            </div>
            <div class="bk-field">
              <label class="bk-label">Check-out Date <span class="bk-opt">(auto)</span></label>
              <div class="bk-auto bk-date-display" id="bkCheckoutDisplay">—</div>
            </div>
            <div class="bk-field">
              <label class="bk-label">Check-in Time <span class="bk-req">*</span></label>
              <input class="bk-input" id="bkCheckinTime" type="time"/>
              <span class="bk-err" id="errCheckinTime"></span>
            </div>
            <div class="bk-field">
              <label class="bk-label">Check-out Time <span class="bk-opt">(auto)</span></label>
              <div class="bk-auto" id="bkCheckoutTime">—</div>
            </div>
            <div class="bk-field">
              <label class="bk-label">Duration</label>
              <div class="bk-auto" id="bkDuration">—</div>
            </div>
          </div>
        </div>

      </div><!-- /bk-body -->

      <div class="bk-footer">
        <button class="bk-btn-cancel" id="bkBtnCancel">Cancel</button>
        <button class="bk-btn-save" id="bkBtnSave">
          <span>Confirm Booking</span>
          <span class="bk-btn-arrow">→</span>
        </button>
      </div>

    </div><!-- /bk-modal -->
  </div><!-- /bk-overlay -->

  <!-- ══════════════════════════════
       BOOKINGS LIST MODAL
  ══════════════════════════════ -->
  <div class="bk-list-overlay" id="bkListOverlay">
    <div class="bk-list-modal">
      <div class="bk-list-header">
        <h3 class="bk-list-title" id="bkListTitle"></h3>
        <button class="bk-close" id="bkListClose">&times;</button>
      </div>
      <div id="bkListBody"></div>
      <div class="bk-list-footer">
        <button class="bk-btn-save" id="bkListAddNew">+ New Booking</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="bk-toast" id="bkToast"></div>

  <!-- JS — order matters: data → events → calendar → modal → booking → background → app -->
  <script src="js/data.js"></script>
  <script src="js/events.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/booking.js"></script>
  <script src="js/background.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
