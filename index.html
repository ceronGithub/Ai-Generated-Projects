<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendar 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- CSS Modules -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <div class="grain-overlay"></div>

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo">
        <span class="logo-year">2026</span>
        <span class="logo-label">Calendar</span>
      </div>
      <div class="mini-today">
        <span class="mini-day-name" id="todayDayName"></span>
        <span class="mini-day-num" id="todayDayNum"></span>
        <span class="mini-month" id="todayMonth"></span>
      </div>
    </div>

    <nav class="month-nav">
      <p class="nav-label">Months</p>
      <ul id="monthList"></ul>
    </nav>

    <div class="sidebar-events">
      <p class="nav-label">Upcoming</p>
      <ul id="upcomingList"></ul>
    </div>
  </aside>

  <main class="main-content">
    <header class="cal-header">
      <div class="cal-header-left">
        <h1 class="cal-month-title" id="calMonthTitle">January</h1>
        <span class="cal-year-tag">2026</span>
      </div>
      <div class="cal-header-right">
        <button class="btn-nav" id="btnPrev">&#8592;</button>
        <button class="btn-today" id="btnToday">Today</button>
        <button class="btn-nav" id="btnNext">&#8594;</button>
      </div>
    </header>

    <div class="weekday-row">
      <span>Sun</span><span>Mon</span><span>Tue</span>
      <span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>
  </main>

  <!-- Event Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="eventModal">
      <button class="modal-close" id="modalClose">&times;</button>
      <h2 class="modal-date" id="modalDate"></h2>
      <ul class="modal-event-list" id="modalEventList"></ul>
      <div class="modal-add">
        <input type="text" class="modal-input" id="eventInput" placeholder="Add event…" maxlength="60"/>
        <button class="modal-add-btn" id="eventAddBtn">+</button>
      </div>
    </div>
  </div>

  <!-- JS Modules -->
  <script src="js/data.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/events.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
