<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2026 — Full Year Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- Animated canvas background -->
  <canvas id="bgCanvas"></canvas>

  <!-- CSS blob fallback (hidden when canvas is active) -->
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <h1 class="header-year">2026</h1>
        <span class="header-label">Full Year Calendar</span>
      </div>
      <div class="header-today-badge" id="todayBadge"></div>
    </div>
  </header>

  <main class="year-grid" id="yearGrid"></main>

  <!-- Event Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="eventModal">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-header-row">
        <div class="modal-color-bar" id="modalColorBar"></div>
        <h2 class="modal-date" id="modalDate"></h2>
      </div>
      <ul class="modal-event-list" id="modalEventList"></ul>
      <div class="modal-add">
        <input type="text" class="modal-input" id="eventInput" placeholder="Add an event…" maxlength="60"/>
        <button class="modal-add-btn" id="eventAddBtn">Add</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/events.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/background.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
